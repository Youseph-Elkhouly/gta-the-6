<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GTA: THE 6</title>
  <meta name="description" content="Grand Theft Auto: The 6, Larp Edition. Downtown Toronto in the browser." />
  <meta name="theme-color" content="#171514" />
  <link rel="icon" href="./assets/brand/gta6-mark.svg" type="image/svg+xml" />
  <script async src="https://umami.cloud6711.workers.dev/script.js" data-website-id="75a0f1a3-3bb4-4dd9-adde-eade0b719665" data-domains="sloptoronto.ca,www.sloptoronto.ca"></script>
  <style>
    :root {
      --ivory: #f4e9d5;
      --ink: #171514;
      --gold: #e5a443;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100%;
      display: grid;
      place-items: end center;
      color: var(--ivory);
      background: #0c0907;
      font-family: Impact, Haettenschweiler, "Arial Narrow", sans-serif;
    }
    .poster {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 46%;
    }
    body::before {
      content: "";
      position: fixed;
      z-index: 1;
      inset: 0;
      background: linear-gradient(to top, rgba(8, 6, 4, 0.94) 0%, rgba(8, 6, 4, 0.35) 42%, rgba(8, 6, 4, 0.2) 100%);
    }
    main {
      position: relative;
      z-index: 1;
      width: min(520px, calc(100% - 32px));
      margin-bottom: max(28px, env(safe-area-inset-bottom));
      text-align: center;
    }
    h1 {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    .enter {
      display: block;
      margin-top: 18px;
      padding: 14px 18px 12px;
      background: var(--ivory);
      color: var(--ink);
      text-decoration: none;
      font-size: 34px;
      letter-spacing: 0.14em;
      line-height: 1;
      box-shadow: 0 0 0 3px #000, 4px 4px 0 #000;
    }
    .enter:hover { background: var(--gold); }
    #credits {
      margin: 14px 0 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.02em;
      color: rgba(244, 233, 213, 0.72);
    }
    #credits a { color: inherit; }
  </style>
</head>
<body>
  <img class="poster" src="./assets/brand/gta6-poster.jpg" alt="" />
  <main>
    <h1>Grand Theft Auto: The 6, Larp Edition</h1>
    <a class="enter" href="./explore.html">ENTER THE 6</a>
    <p id="credits">Downtown Toronto. City engine © Mr.doob and John Fewell, MIT. <a href="./CREDITS.md">Credits</a>.</p>
  </main>
</body>
</html>
